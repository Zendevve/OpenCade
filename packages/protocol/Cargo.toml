[package]
name = "opencade-protocol"
version = "0.1.0"
edition = "2024"
description = "OpenCade versioned protocol envelope (shared client/server)"
license = "Apache-2.0"
repository = "https://github.com/opencade/opencade"
rust-version = "1.98"
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "chrono-impl", "uuid-impl"] }
