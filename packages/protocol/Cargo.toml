[package]
name = "openfight-protocol"
version = "0.1.0"
edition = "2021"
description = "OpenFight versioned protocol envelope (shared client/server)"
license = "Apache-2.0"
repository = "https://github.com/openfight/openfight"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
