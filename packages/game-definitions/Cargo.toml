[package]
name = "opencade-game-definitions"
version = "0.1.0"
edition = "2024"
description = "OpenCade declarative game definitions (TOML) — schema_version 1"
license = "Apache-2.0"
repository = "https://github.com/opencade/opencade"
rust-version = "1.98"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
thiserror = "2.0.20"
regex = "1.13.1"

[dev-dependencies]
tempfile = "3.27.0"
