[package]
name = "openfight-game-definitions"
version = "0.1.0"
edition = "2021"
description = "OpenFight declarative game definitions (TOML) — schema_version 1"
license = "Apache-2.0"
repository = "https://github.com/openfight/openfight"
rust-version = "1.78"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
