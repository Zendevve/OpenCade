[package]
name = "openfight-networking"
version = "0.1.0"
edition = "2021"
description = "OpenFight networking — signaling, NAT traversal, relay (placeholder for M1)"
license = "Apache-2.0"
repository = "https://github.com/openfight/openfight"
rust-version = "1.78"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
openfight-emulator-sdk = { path = "../emulator-sdk" }
