# Clippy configuration for OpenCade
# See https://doc.rust-lang.org/clippy/configuration.html
# This file is read by `cargo clippy` at workspace root.
# Rust 1.98 reads this dotfile directly; keep a single config to avoid ambiguity.

msrv = "1.98"
cognitive-complexity-threshold = 30
too-many-arguments-threshold = 7
type-complexity-threshold = 250
single-char-binding-names-threshold = 0
disallowed-names = ["foo", "baz", "quux"]
allow-mixed-uninlined-format-args = false
allow-print-in-tests = true
