[package]
name = "opencade-proof-of-match"
version = "0.1.0"
edition = "2024"
description = "OpenCade proof-of-match — deterministic two-peer MockAdapter scenario producing canonical redacted MatchReport evidence"
license = "Apache-2.0"
repository = "https://github.com/opencade/opencade"
rust-version = "1.98"

[dependencies]
opencade-emulator-sdk = { path = "../../packages/emulator-sdk" }
opencade-networking = { path = "../../packages/networking" }
opencade-protocol = { path = "../../packages/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
chrono = "0.4.45"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
