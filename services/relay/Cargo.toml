[package]
name = "opencade-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
description = "OpenCade relay service (WS TURN-like fallback)"
repository = "https://github.com/opencade/opencade"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
futures = "0.3"
opencade-protocol = { path = "../../packages/protocol" }
uuid = { version = "1", features = ["v4"] }
