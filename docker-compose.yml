name: openfight

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openfight
      POSTGRES_PASSWORD: openfight
      POSTGRES_DB: openfight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfight -d openfight"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  openfight-server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    image: openfight-server:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://openfight:openfight@db:5432/openfight
      RUST_LOG: info
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET to at least 32 random bytes}
      OPENFIGHT_ENV: production
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # openfight-relay: TURN/relay placeholder for future M3.
  # Uncomment when services/relay implements the relay binary.
  # relay:
  #   build:
  #     context: .
  #     dockerfile: ./services/relay/Dockerfile
  #   image: openfight-relay:local
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     RUST_LOG: info
  #   ports:
  #     - "3478:3478"
  #     - "3478:3478/udp"

volumes:
  pgdata:
    driver: local
