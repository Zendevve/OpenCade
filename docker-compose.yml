name: opencade

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencade
      POSTGRES_PASSWORD: opencade
      POSTGRES_DB: opencade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencade -d opencade"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  opencade-server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    image: opencade-server:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://opencade:opencade@db:5432/opencade
      RUST_LOG: info
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET to at least 32 random bytes}
      OPENCADE_ENV: production
      PORT: 8080
      # Must be reachable by desktop clients; override for remote/LAN deployments.
      RELAY_URL: ${RELAY_URL:-ws://localhost:8081/relay}
      RELAY_AUTH_SECRET: ${RELAY_AUTH_SECRET:?set RELAY_AUTH_SECRET to at least 32 random bytes}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  relay:
    build:
      context: .
      dockerfile: ./services/relay/Dockerfile
    image: opencade-relay:local
    restart: unless-stopped
    environment:
      RUST_LOG: info
      PORT: 8081
      RELAY_AUTH_SECRET: ${RELAY_AUTH_SECRET:?set RELAY_AUTH_SECRET to at least 32 random bytes}
    ports:
      - "8081:8081"
volumes:
  pgdata:
    driver: local
