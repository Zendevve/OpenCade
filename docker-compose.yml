name: opencade

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a random value}
      POSTGRES_DB: opencade
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencade -d opencade"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    image: opencade-server:local
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["opencade-server", "--migrate"]
    environment: &server-environment
      DATABASE_URL: postgres://opencade:${POSTGRES_PASSWORD}@db:5432/opencade
      RUST_LOG: info
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET to at least 32 random bytes}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?set OPERATOR_TOKEN to at least 32 random bytes}
      OPENCADE_ENV: production
      PORT: 8080
      PUBLIC_RELAY_URL: ${PUBLIC_RELAY_URL:?set PUBLIC_RELAY_URL to the externally reachable wss relay URL}
      STUN_HOST: ${STUN_HOST:?set STUN_HOST to the externally reachable STUN host}
      RELAY_AUTH_SECRET: ${RELAY_AUTH_SECRET:?set RELAY_AUTH_SECRET to at least 32 random bytes}

  opencade-server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    image: opencade-server:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *server-environment
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  relay:
    build:
      context: .
      dockerfile: ./services/relay/Dockerfile
    image: opencade-relay:local
    restart: unless-stopped
    environment:
      RUST_LOG: info
      PORT: 8081
      RELAY_AUTH_SECRET: ${RELAY_AUTH_SECRET:?set RELAY_AUTH_SECRET to at least 32 random bytes}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  pgdata:
    driver: local
