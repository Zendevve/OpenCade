name: opencade

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opencade}
      POSTGRES_DB: opencade
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencade -d opencade"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    image: opencade-server:local
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["opencade-server", "--migrate"]
    environment: &server-environment
      DATABASE_URL: postgres://opencade:${POSTGRES_PASSWORD:-opencade}@db:5432/opencade
      RUST_LOG: ${RUST_LOG:-info}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me-at-least-32-bytes-long}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-dev-operator-token-change-me-at-least-32-bytes-long}
      OPENCADE_ENV: production
      PORT: 8080
      PUBLIC_RELAY_URL: ${PUBLIC_RELAY_URL:-wss://relay.example.com/relay}
      STUN_HOST: ${STUN_HOST:-stun.example.com}
      RELAY_AUTH_SECRET: ${RELAY_AUTH_SECRET:-dev-relay-secret-change-me-at-least-32-bytes-long}
      OPENCADE_EVIDENCE_TCP_TUNNEL: ${OPENCADE_EVIDENCE_TCP_TUNNEL:-false}
      ROUTE_POLICY_MIN_ATTEMPTS: ${ROUTE_POLICY_MIN_ATTEMPTS:-10}

  opencade-server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    image: opencade-server:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *server-environment
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  relay:
    build:
      context: .
      dockerfile: ./services/relay/Dockerfile
    image: opencade-relay:local
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PORT: 8081
      RELAY_AUTH_SECRET: ${RELAY_AUTH_SECRET:-dev-relay-secret-change-me-at-least-32-bytes-long}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  pgdata:
    driver: local
