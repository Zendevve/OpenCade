[package]
name = "openfight-server"
version = "0.1.0"
edition = "2021"
description = "OpenFight server (Axum + PostgreSQL)"
authors = ["OpenFight Contributors"]
license = "Apache-2.0"
repository = "https://github.com/openfight/openfight"
rust-version = "1.77"

[dependencies]
axum = { version = "0.7", features = ["ws", "json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
argon2 = "0.5"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
sha2 = "0.10"
dashmap = "5"
thiserror = "1"
openfight-protocol = { path = "../../packages/protocol" }

[dev-dependencies]
serial_test = "3"
