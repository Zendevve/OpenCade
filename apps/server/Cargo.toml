[package]
name = "opencade-server"
version = "0.1.0"
edition = "2024"
description = "OpenCade server (Axum + PostgreSQL)"
authors = ["OpenCade Contributors"]
license = "Apache-2.0"
repository = "https://github.com/opencade/opencade"
rust-version = "1.98"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "json"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate", "macros"] }
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
regex = "1.13.1"
sha2 = "0.11.0"
hex = "0.4.3"
dashmap = "6.2.1"
thiserror = "2.0.20"
opencade-protocol = { path = "../../packages/protocol" }
opencade-shared = { path = "../../packages/shared" }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.30.0"
