[package]
name = "openfight-client"
version = "0.1.0"
edition = "2021"
description = "OpenFight desktop client (Tauri + Rust backend)"
authors = ["OpenFight Contributors"]
license = "Apache-2.0"
repository = "https://github.com/openfight/openfight"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
