[package]
name = "opencade-client"
version = "0.1.0"
edition = "2024"
description = "OpenCade desktop client (Tauri + Rust backend)"
authors = ["OpenCade Contributors"]
license = "Apache-2.0"
repository = "https://github.com/opencade/opencade"
rust-version = "1.98"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
keyring = "4.1.6"
opencade-adapter-fbneo = { path = "../../../adapters/fbneo" }
opencade-adapter-retroarch = { path = "../../../adapters/retroarch" }
opencade-emulator-sdk = { path = "../../../packages/emulator-sdk" }
opencade-networking = { path = "../../../packages/networking" }
opencade-protocol = { path = "../../../packages/protocol" }
opencade-shared = { path = "../../../packages/shared" }
uuid = { version = "1.25.0", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Tauri is checked in a platform-specific CI job and keeps its own lockfile.
[workspace]
